data:
  raw_geotiffs_dir: data/raw/geotiffs
  processed_dir: data/processed
  raw_labels_dir: data/raw/labels
  patch_size: 512

model:
  architecture: unet
  encoder: resnet34
  num_classes: 1

training:
  batch_size: 8
  epochs: 20
  learning_rate: 1e-4
  val_split: 0.2

inference:
  tile_overlap: 32
  threshold: 0.5
